name: Tests Generation

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/**'

  workflow_dispatch:
    inputs:
      mode:
        description: Test generation mode
        required: true
        type: choice
        default: changes
        options:
          - changes
          - missing

permissions:
  contents: read

concurrency:
  group: ai-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  MODE: ${{ inputs.mode || 'changes' }}

jobs:
  generate-tests:
    name: Generate and validate tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      has_tests: ${{ steps.validate.outputs.has_tests }}

    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare files
        id: prepare
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$MODE" == "missing" ]]; then
            find src/main/java -type f -name '*.java' \
              | sort > changed-files.txt
          else
            base_sha="$BEFORE_SHA"

            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] &&
                 git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                base_sha="$(git rev-parse HEAD^)"
              else
                base_sha="$(git hash-object -w -t tree /dev/null)"
              fi
            fi

            git diff --name-only --diff-filter=ACMR "$base_sha" HEAD \
              -- ':(glob)src/main/java/**/*.java' > changed-files.txt
          fi

          echo "Files to analyze:"
          cat changed-files.txt

          if [[ -s changed-files.txt ]]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.prepare.outputs.has_files == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Copilot CLI
        if: steps.prepare.outputs.has_files == 'true'
        run: npm install -g @github/copilot

      - name: Generate tests
        if: steps.prepare.outputs.has_files == 'true'
        shell: bash
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
        run: |
          copilot_args=(
            --agent=test-generator
            --no-ask-user
            '--available-tools=view,grep,glob,skill,create,edit,apply_patch'
            '--allow-tool=read,write'
            --prompt "Use mode '$MODE' and read changed-files.txt. Create only new Java test files under src/test/java. Treat existing files as read-only. The workflow handles Git and Maven."
          )

          copilot "${copilot_args[@]}"

      - name: Validate and package new tests
        id: validate
        if: steps.prepare.outputs.has_files == 'true'
        shell: bash
        run: |
          rm -f changed-files.txt

          if ! git diff --quiet HEAD -- || ! git diff --cached --quiet HEAD --; then
            echo "Existing files or the Git index were modified."
            git status --short
            exit 1
          fi

          generated="$RUNNER_TEMP/generated-tests"
          manifest="$RUNNER_TEMP/generated-test-files"
          mkdir -p "$generated"

          git ls-files --others --exclude-standard -z > "$manifest"
          has_tests=false

          while IFS= read -r -d '' file; do
            case "$file" in
              src/test/java/*Test.java)
                if [[ ! -f "$file" || -L "$file" ]]; then
                  echo "Invalid test file: $file"
                  exit 1
                fi

                cp --parents -- "$file" "$generated/"
                has_tests=true
                ;;
              *)
                echo "Unauthorized file: $file"
                exit 1
                ;;
            esac
          done < "$manifest"

          echo "has_tests=$has_tests" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.validate.outputs.has_tests == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        if: steps.validate.outputs.has_tests == 'true'
        shell: bash
        run: bash ./mvnw -B test

      - name: Upload generated tests and Maven reports
        if: ${{ always() && steps.validate.outputs.has_tests == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests-and-reports
          path: |
            ${{ runner.temp }}/generated-tests/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload validated tests for PR
        if: steps.validate.outputs.has_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr-tests
          path: ${{ runner.temp }}/generated-tests/
          if-no-files-found: error
          retention-days: 1

  create-pr:
    name: Create pull request
    needs: generate-tests
    if: needs.generate-tests.outputs.has_tests == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Download validated tests
        uses: actions/download-artifact@v4
        with:
          name: pr-tests
          path: ${{ runner.temp }}/generated-tests

      - name: Copy new tests into the checkout
        shell: bash
        run: |
          generated="$RUNNER_TEMP/generated-tests"
          manifest="$RUNNER_TEMP/validated-test-files"

          find "$generated/src/test/java" -type f -name '*Test.java' \
            -print0 > "$manifest"

          while IFS= read -r -d '' file; do
            target="${file#"$generated"/}"

            if [[ -e "$target" || -L "$target" ]]; then
              echo "Test already exists on main: $target"
              exit 1
            fi

            mkdir -p -- "$(dirname -- "$target")"
            cp -- "$file" "$target"
          done < "$manifest"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/tests-${{ env.MODE }}
          delete-branch: true
          add-paths: src/test/java/
          commit-message: 'test: add generated automated tests'
          title: 'test: add generated tests (${{ env.MODE }})'
          body: |
            ## Automated test generation

            Generated by the test-generator agent.

            **Mode:** `${{ env.MODE }}`

            Maven validation passed on `${{ github.sha }}`.

            Please review the generated tests before merging.