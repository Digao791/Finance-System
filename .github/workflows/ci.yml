name: Continuos Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  tests:
    name: Test
    runs-on : ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name : Set up JDK 21
        uses : actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
        
      - name: Run Tests
        run : mvn --batch-mode test

  build:
    name : Build
    needs:
      - tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with: 
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Build with maven
        run : mvn -B package --file pom.xml

