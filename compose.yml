services:

  database:
    image: postgres:18-alpine
    container_name: finance-postgres

    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance

    ports:
      - "5432:5432"
    
    volumes:
      - finance_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/finance
      SPRING_DATASOURCE_USERNAME: finance
      SPRING_DATASOURCE_PASSWORD: finance
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api
volumes:
  finance_postgres_data: